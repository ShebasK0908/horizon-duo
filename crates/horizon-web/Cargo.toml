[package]
name = "horizon-web"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.90"
description = "Horizon browser client"

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
horizon-assets = { path = "../horizon-assets" }
horizon-core = { path = "../horizon-core" }
horizon-world = { path = "../horizon-world" }
horizon-client-render = { path = "../horizon-client-render" }
glam = "0.30"
serde_json = "1"
winit = "0.30.13"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
console_log = "1"
log = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "HtmlElement"] }

[lints]
workspace = true
