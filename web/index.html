<!doctype html>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>Horizon browser</title>
<style>body{margin:0;background:#15202a;color:#eee;font:16px system-ui}header{padding:16px}canvas{display:block;width:960px;height:auto;max-width:100%}#viewport{position:relative;width:960px;max-width:100%}#error{color:#faa}#crosshair{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none}label, #controls{margin:0 16px}</style>
<header>Horizon renderer validation. Original synthetic mesh. Gameplay and multiplayer are not connected.</header>
<label id="import" hidden>Import your prepared Horizon resources (.zip) <input type="file" accept=".zip" aria-label="Prepared resources"></label>
<label id="materials" hidden>Creative block <select id="block" aria-label="Creative block"></select></label>
<p id="controls" hidden>Click the world to focus. WASD move, Space jump, Shift crouch, Ctrl sprint, mouse or arrow keys look. F places a block, R breaks. Double Space toggles creative flight.</p>
<div id="viewport"><span id="crosshair" hidden>+</span></div>
<pre id="error"></pre>
<script type="module">
import init, {run_render_fixture, run_owned_resources, connect_world} from './pkg/horizon_web.js';
const fail = error => {document.querySelector('#error').textContent=String(error); console.error(error);};
await init();
const params=new URLSearchParams(location.search);
if (params.has('owned') || params.has('world')) {
    document.querySelector('header').textContent=params.has('world') ? 'Horizon browser — remote world' : 'Horizon owned-resource rendering validation.';
    document.querySelector('#import').hidden=false;
    document.querySelector('input').addEventListener('change', async event => {
        try {
            const bytes=new Uint8Array(await event.target.files[0].arrayBuffer());
            if (params.has('world')) {
                const bridge=new URL(params.get('bridge') || location.origin.replace('http','ws'));
                bridge.pathname='/world/'+encodeURIComponent(params.get('world'));
                await connect_world(bytes, bridge.href, params.get('world'), params.get('name') || 'Player'+crypto.getRandomValues(new Uint16Array(1))[0]);
            } else {await run_owned_resources(bytes);}
        }
        catch(error) {fail(error);}
    }, {once:true});
} else {
    try {await run_render_fixture();} catch(error) {fail(error);}
}
</script>
