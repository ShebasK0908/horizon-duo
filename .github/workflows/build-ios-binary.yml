name: Build iOS IPA (binary only)

on:
  workflow_dispatch:

jobs:
  build:
    name: build-ios-binary-only
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: |
          rustup target add aarch64-apple-ios
          rustc --version
          cargo --version

      - name: Build client binary for iOS
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        run: |
          cargo build --profile fast --target aarch64-apple-ios -p horizon-client --bin horizon-client --no-default-features --features audio,mods

      - name: Package IPA (app only, no game resources)
        run: |
          set -euo pipefail
          bundle_id=dev.horizon.ios
          minimum_os=16.0
          platform=iPhoneOS
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/horizon-client/Cargo.toml | head -1)
          echo "Version: $version"
          app=.local/ios/device/Horizon.app
          rm -rf "$app"
          mkdir -p "$app"
          cp target/aarch64-apple-ios/fast/horizon-client "$app/"
          sed -e "s/@BUNDLE_ID@/$bundle_id/" -e "s/@VERSION@/$version/g" -e "s/@PLATFORM@/$platform/" \
            -e "s/@MINIMUM_OS@/$minimum_os/" packaging/ios/Info.plist > "$app/Info.plist"
          work=$(mktemp -d)
          iconutil -c iconset -o "$work/horizon.iconset" packaging/icons/horizon.icns
          icons=$work/Assets.xcassets/AppIcon.appiconset
          mkdir -p "$icons"
          cp "$work/horizon.iconset/icon_512x512@2x.png" "$icons/icon.png"
          echo '{"images":[{"filename":"icon.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}' \
            > "$icons/Contents.json"
          xcrun actool --compile "$app" --platform iphoneos --minimum-deployment-target "$minimum_os" \
            --app-icon AppIcon --output-partial-info-plist "$work/icon.plist" "$work/Assets.xcassets" >/dev/null
          /usr/libexec/PlistBuddy -c "Merge $work/icon.plist" "$app/Info.plist"
          plutil -lint "$app/Info.plist"
          codesign --force --sign - "$app"
          codesign --verify --strict --verbose=2 "$app"
          mkdir "$work/Payload"
          cp -R "$app" "$work/Payload/"
          (cd "$work" && zip -qry "$GITHUB_WORKSPACE/.local/ios/device/Horizon.ipa" Payload)
          ls -la .local/ios/device/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Horizon-ipa-app-only
          path: .local/ios/device/Horizon.ipa
          if-no-files-found: error
