name: Build iOS IPA (binary only)

on:
  workflow_dispatch:

jobs:
  build:
    name: build-ios-binary-only
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: |
          rustup target add aarch64-apple-ios
          rustc --version
          cargo --version

      - name: Build client binary for iOS
        run: |
          cargo build --profile fast --target aarch64-apple-ios -p horizon-client --bin horizon-client --no-default-features --features audio,mods

      - name: Package IPA (app only, no game resources)
        run: |
          mkdir -p .local/ios/Payload/Horizon.app
          cp target/aarch64-apple-ios/fast/horizon-client .local/ios/Payload/Horizon.app/Horizon
          cp packaging/ios/Info.plist .local/ios/Payload/Horizon.app/Info.plist
          chmod +x .local/ios/Payload/Horizon.app/Horizon
          cd .local/ios
          zip -qry Horizon.ipa Payload
          ls -la

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Horizon-ipa-app-only
          path: .local/ios/Horizon.ipa
          if-no-files-found: error
